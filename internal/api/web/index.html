<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Butler · 任务管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24332f;background:#f3f5f3;font-size:16px;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:32px 20px}header,.toolbar,.row,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:24px}h1{margin:0;font-size:28px}p{line-height:1.6}.muted,small{color:#61746b}.toolbar{margin-bottom:20px}.toolbar input{flex:1;min-width:180px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #c6d0ca;border-radius:8px;background:white;padding:10px 16px;color:inherit;min-height:44px}button.primary{background:#24664d;color:white;border-color:#24664d}button.danger{color:#a52d32}button:disabled{opacity:.5;cursor:wait}input,textarea,select{width:100%;padding:11px;border:1px solid #bccac2;border-radius:7px;background:white;color:inherit}input[type=checkbox]{width:19px;height:19px;accent-color:#24664d}textarea{resize:vertical}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #83bfa4;outline-offset:2px}#tasks{display:grid;gap:14px}.card{background:white;border:1px solid #d7dfda;border-radius:12px;padding:20px}.card h2{margin:0;font-size:19px;overflow-wrap:anywhere}.card .body{white-space:pre-wrap;overflow-wrap:anywhere}.card .row{justify-content:space-between}.badge{font-size:13px;background:#e5f2e9;border-radius:5px;padding:4px 8px}.badge.off{background:#eee;color:#65716a}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin:16px 0;overflow-wrap:anywhere}#status{min-height:24px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}#status.error,.error{color:#a52d32}.empty{text-align:center;padding:50px 15px;color:#61746b}dialog{width:min(680px,calc(100% - 24px));max-height:92dvh;border:0;border-radius:14px;padding:24px;color:inherit}dialog::backdrop{background:#172c235e}dialog h2{margin-top:0}form{display:grid;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-size:14px}fieldset{border:1px solid #d7dfda;border-radius:8px;padding:12px}fieldset label,.check{display:flex;align-items:center;gap:8px}.channels{display:flex;gap:16px;flex-wrap:wrap}#formError{color:#a52d32;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px;line-height:1.6;margin:0;color:#61746b}.actions{justify-content:flex-end}#commandFields{display:grid;gap:14px}[hidden]{display:none!important}@media(max-width:600px){main{padding:20px 12px}header{align-items:flex-start}h1{font-size:24px}.fields,.meta{grid-template-columns:1fr}.card{padding:16px}dialog{padding:20px 16px}.actions button{flex:1}.toolbar select{width:100%}}
</style>
</head>
<body><main>
<header><div><h1>Butler</h1><p class="muted" style="margin:6px 0">任务与定时通知管理</p></div><button id="newTask" class="primary">＋ 新建任务</button></header>
<div class="toolbar"><input id="search" type="search" placeholder="搜索标题、正文" aria-label="搜索任务"><select id="filter" aria-label="任务状态" style="max-width:180px"><option value="all">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select><button id="refresh">刷新</button><button id="exportTasks">导出 JSON</button><button id="importTasks">导入 JSON</button><input id="importFile" type="file" accept=".json,application/json" aria-label="选择任务 JSON 文件" hidden></div>
<div id="transferStatus" role="status" aria-live="polite" style="white-space:pre-wrap;overflow-wrap:anywhere"></div><div id="status" role="status" aria-live="polite"></div><div id="tasks"></div>
<p class="hint">下一次时间来自服务端计算，可能包含待补发的时间；尚未触发的间隔任务仅显示估算时间。显示时间采用浏览器所在时区。页面不会修改服务配置或通知渠道凭据。</p>
</main>
<dialog id="editor" aria-labelledby="editorTitle"><h2 id="editorTitle">新建任务</h2>
<form id="taskForm">
<label>标题<input id="title" required maxlength="500"></label>
<label>通知正文<textarea id="body" rows="3"></textarea></label>
<div class="fields"><label>调度方式<select id="scheduleType"><option value="cron">Cron 表达式</option><option value="interval">固定间隔</option><option value="once">一次性</option><option value="solar">每年公历</option><option value="lunar">每年农历</option></select></label><label>调度表达式<input id="expression" required spellcheck="false"></label></div>
<p id="scheduleHint" class="hint"></p>
<label>触发偏移（可选，每行一个）<textarea id="offsets" rows="2" placeholder="T-1d&#10;T0m" spellcheck="false"></textarea></label><p class="hint">例如 T-1d 提前一天、T0m 原定时间、T1h 延后一小时。设置偏移后，若还需要原定时间通知，请包含 T0m。</p>
<fieldset><legend>通知渠道（至少一个）</legend><div id="channels" class="channels"></div><p class="hint">渠道须在服务配置中可用；此处列出的是程序支持的渠道。</p></fieldset>
<label>附加行为<select id="actionType"><option value="">仅发送通知</option><option value="command">执行命令并通知</option></select></label>
<div id="commandFields" hidden><label>可执行程序<input id="command" placeholder="例如 /usr/bin/echo" spellcheck="false"></label><label>参数（每行一个）<textarea id="args" rows="3" spellcheck="false"></textarea></label><label>工作目录（可选）<input id="dir" spellcheck="false"></label><label>环境变量（JSON 对象，可选）<textarea id="env" rows="2" placeholder='{"NAME":"value"}' spellcheck="false"></textarea></label><p class="hint">命令在服务所在设备执行，使用服务进程的权限。参数直接传入程序，不自动经过 shell。</p></div>
<label class="check"><input id="enabled" type="checkbox" checked>启用任务</label><div id="formError" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" id="save" class="primary">保存任务</button></div>
</form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let tasks=[], channels=[], editing=null, saving=false, loading=false;
const labels={system:'桌面通知',mqtt:'MQTT',email:'邮件',messagebox:'消息框'};
const schedules={cron:['例如 */5 * * * *','Cron 使用五段：分 时 日 月 星期。例如 */5 * * * * 表示每 5 分钟。'],interval:['例如 15m 或 1h,30m','支持 d、h、m、s，用逗号组合，例如 1h,30m。'],once:['2026-12-01 09:00:00','格式 YYYY-MM-DD HH:mm:ss。当前一次性解析使用 UTC，保存时请按 UTC 填写。'],solar:['12-01 09:00:00','格式 MM-DD HH:mm:ss，每年按公历触发。'],lunar:['01-01 09:00:00','格式 MM-DD HH:mm:ss，每年按农历触发；当前解析器对部分农历日期仍有限制。']};
async function api(path,data){const response=await fetch('/api/v1/'+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const text=await response.text();let result;try{result=JSON.parse(text)}catch{throw new Error('服务返回了无法解析的响应（HTTP '+response.status+'）')}if(!response.ok)throw new Error(result?.error||'请求失败（HTTP '+response.status+'）');return result;}
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'';}
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function date(value){if(!value)return '—';const parsed=new Date(value);return Number.isNaN(parsed.getTime())?'—':parsed.toLocaleString();}
function render(){const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;const shown=tasks.filter(t=>(filter==='all'||t.enabled===(filter==='enabled'))&&(t.title+' '+t.body).toLowerCase().includes(query)).sort((a,b)=>(a.nextTriggeredAt?new Date(a.nextTriggeredAt).getTime():Infinity)-(b.nextTriggeredAt?new Date(b.nextTriggeredAt).getTime():Infinity)||a.id-b.id);$('tasks').replaceChildren();if(!shown.length){$('tasks').append(el('div',tasks.length?'没有符合条件的任务':'暂无任务，点击“新建任务”开始。','empty'));return;}for(const task of shown){const card=el('article',undefined,'card'),top=el('div',undefined,'row');top.append(el('h2',task.title||'未命名任务'),el('span',task.enabled?'已启用':'已停用','badge'+(task.enabled?'':' off')));card.append(top,el('p',task.body||'（无正文）','body'));const meta=el('div',undefined,'meta');for(const text of ['规则：'+task.scheduleType+' · '+task.scheduleExpression,'渠道：'+(task.channels||task.channel||[]).map(c=>labels[c]||c).join('、'),'下次：'+(task.enabled?date(task.nextTriggeredAt):'已停用'),'上次：'+date(task.lastFired)])meta.append(el('div',text));card.append(meta);if(task.scheduleError)card.append(el('p','调度配置错误：'+task.scheduleError,'error'));const actions=el('div',undefined,'actions'),edit=el('button','编辑'),remove=el('button','删除','danger');edit.onclick=()=>openEditor(task);remove.onclick=()=>deleteTask(task,remove);actions.append(edit,remove);card.append(actions);$('tasks').append(card);}}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;status('正在加载…');try{tasks=await api('tasks');render();status('共 '+tasks.length+' 个任务 · 已刷新 '+new Date().toLocaleTimeString());}catch(error){status('加载失败：'+error.message,true);}finally{loading=false;$('refresh').disabled=false;}}
function scheduleHint(){const hint=schedules[$('scheduleType').value];$('expression').placeholder=hint[0];$('scheduleHint').textContent=hint[1];}
function actionFields(){$('commandFields').hidden=$('actionType').value!=='command';$('command').required=!$('commandFields').hidden;}
function openEditor(task=null){editing=task;$('taskForm').reset();$('editorTitle').textContent=task?'编辑任务 #'+task.id:'新建任务';$('title').value=task?.title||'';$('body').value=task?.body||'';$('scheduleType').value=task?.scheduleType||'cron';$('expression').value=task?.scheduleExpression||'*/5 * * * *';$('offsets').value=(task?.scheduleOffset||[]).join('\n');$('enabled').checked=task?task.enabled:true;$('actionType').value=task?.actionType||'';const action=task?.actionExpression||{};$('command').value=action.Command||action.command||'';$('args').value=(action.Args||action.args||[]).join('\n');$('dir').value=action.Dir||action.dir||'';const env=action.Env||action.env;$('env').value=env?JSON.stringify(env,null,2):'';$('formError').textContent='';$('channels').replaceChildren();const selected=task?(task.channel||task.channels||[]):['system'];for(const channel of [...new Set([...channels,...selected])]){const label=el('label'),input=el('input');input.type='checkbox';input.value=channel;input.checked=selected.includes(channel);label.append(input,document.createTextNode(labels[channel]||channel));$('channels').append(label);}scheduleHint();actionFields();$('editor').showModal();}
async function deleteTask(task,button){if(!confirm('确定删除“'+task.title+'”？此操作不可撤销。'))return;button.disabled=true;try{await api('delete',{id:task.id});await load();}catch(error){status('删除失败：'+error.message,true);}finally{button.disabled=false;}}
$('taskForm').onsubmit=async event=>{event.preventDefault();if(saving)return;$('formError').textContent='';try{const selected=Array.from($('channels').querySelectorAll('input:checked'),input=>input.value);if(!selected.length)throw new Error('请至少选择一个通知渠道。');let action={};if($('actionType').value==='command'){const env=$('env').value.trim()?JSON.parse($('env').value):{};if(!env||Array.isArray(env)||typeof env!=='object'||Object.values(env).some(value=>typeof value!=='string'))throw new Error('环境变量必须是键和值均为字符串的 JSON 对象。');action={Command:$('command').value.trim(),Args:$('args').value===''?[]:$('args').value.split(/\r?\n/),Dir:$('dir').value.trim(),Env:env};}const task={id:editing?.id||0,title:$('title').value.trim(),body:$('body').value,scheduleType:$('scheduleType').value,scheduleExpression:$('expression').value.trim(),scheduleOffset:$('offsets').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),channel:selected,actionType:$('actionType').value,actionExpression:action,enabled:$('enabled').checked};if(!task.title)throw new Error('请填写标题。');saving=true;$('save').disabled=true;$('cancel').disabled=true;const result=await api(editing?'update':'add',task);if(!editing&&!(result.id>0))throw new Error('未创建任务，请检查是否已存在相同标题和正文的任务。');$('editor').close();await load();}catch(error){$('formError').textContent='保存失败：'+error.message;}finally{saving=false;$('save').disabled=false;$('cancel').disabled=false;}};
// Transfer endpoints also support plain-text success responses.
let transferring = false;
function transferStatus(message, error = false) {
    $('transferStatus').textContent = message;
    $('transferStatus').className = error ? 'error' : '';
}
function transferBusy(busy) {
    transferring = busy;
    $('exportTasks').disabled = busy;
    $('importTasks').disabled = busy;
    $('importFile').disabled = busy;
}
async function transferResponse(response) {
    const text = await response.text();
    let result;
    try { result = JSON.parse(text); } catch { result = text; }
    if (!response.ok) {
        let message = typeof result === 'object' && result !== null
            ? result.error : result;
        message = message || '请求失败（HTTP ' + response.status + '）';
        if (result && typeof result === 'object' && Number.isInteger(result.added)) {
            message += '；已新增 ' + result.added + ' 条，跳过 ' + (result.skipped || 0) + ' 条';
        }
        throw new Error(message);
    }
    return result;
}
async function exportTasks() {
    if (transferring) return;
    transferBusy(true);
    transferStatus('正在导出…');
    let url;
    try {
        const response = await fetch('/api/v1/output');
        if (!response.ok) await transferResponse(response);
        const data = await response.blob();
        url = URL.createObjectURL(data);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'butler-tasks-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.append(link);
        link.click();
        link.remove();
        transferStatus('已发起 JSON 下载，请在浏览器下载记录中查看。');
    } catch (error) {
        transferStatus('导出失败：' + error.message, true);
    } finally {
        // Give the browser time to consume the download URL.
        if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
        transferBusy(false);
    }
}
async function importTasks(event) {
    const file = event.target.files[0];
    event.target.value = ''; // Allow choosing the same file again after a failure.
    if (!file || transferring) return;
    transferBusy(true);
    transferStatus('正在检查 JSON 文件…');
    let submitted = false;
    try {
        // Leave room for multipart headers under the server's 5 MiB request limit.
        if (file.size > 5 * 1024 * 1024 - 64 * 1024) {
            throw new Error('文件过大，请选择小于约 4.9 MiB 的 JSON 文件。');
        }
        let data;
        try { data = JSON.parse(await file.text()); }
        catch { throw new Error('文件不是有效的 JSON，请检查内容。'); }
        if (!Array.isArray(data) || data.some(task => !task || typeof task !== 'object' || Array.isArray(task))) {
            throw new Error('文件内容应是任务对象组成的 JSON 数组。');
        }
        if (!data.length) {
            transferStatus('文件中没有任务，无需导入。');
            return;
        }
        const form = new FormData();
        form.append('file', file);
        transferStatus('正在导入 ' + data.length + ' 条任务，请稍候…');
        submitted = true;
        const result = await transferResponse(await fetch('/api/v1/load', {
            method: 'POST', body: form
        }));
        if (result && typeof result === 'object' && Number.isInteger(result.added)) {
            transferStatus('导入完成：新增 ' + result.added + ' 条，跳过 ' + (result.skipped || 0) + ' 条。');
        } else {
            transferStatus('导入完成，服务端已接受文件中的 ' + data.length + ' 条任务。');
        }
    } catch (error) {
        transferStatus('导入失败：' + error.message + (submitted
            ? '。部分任务可能已经写入，列表将重新加载，请核对结果。' : ''), true);
    } finally {
        if (submitted) await load();
        transferBusy(false);
    }
}
$('exportTasks').onclick = exportTasks;
$('importTasks').onclick = () => $('importFile').click();
$('importFile').onchange = importTasks;
$('editor').addEventListener('cancel',event=>{if(saving)event.preventDefault();});$('cancel').onclick=()=>$('editor').close();$('newTask').onclick=()=>openEditor();$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('scheduleType').onchange=scheduleHint;$('actionType').onchange=actionFields;
(async()=>{try{channels=await api('channels');}catch(error){status('无法加载通知渠道：'+error.message,true);$('newTask').disabled=true;return;}await load();})();
</script></body></html>
